# GoReleaser configuration for chunk
# Documentation: https://goreleaser.com

version: 2

# Archives are named chunk_<Os>_<arch>.tar.gz; install.sh and `chunk upgrade`
# download exactly that, and internal/upgrade pins its name to this template.
project_name: chunk

before:
  hooks:
    - go run . completion bash --output share/bash-completion/completions/chunk
    - go run . completion zsh --output share/zsh/site-functions/_chunk
    - go run . completion fish --output share/fish/vendor_completions.d/chunk.fish
    - go run . man --output share/man/man1/chunk.1

builds:
  - id: chunk
    binary: chunk
    main: .

    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath

    ldflags:
      # The version carries its "v" so `chunk --version` prints the tag.
      - "-s -w -X main.version=v{{.Version}} -X github.com/CircleCI-Public/chunk-cli/internal/telemetry.WriteKey={{ envOrDefault \"CHUNK_TELEMETRY_WRITE_KEY\" \"\" }}"

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # Windows users expect .zip; other platforms keep the default tarball.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    builds_info:
      group: root
      owner: root
    files:
      - LICENSE
      - README.md
      - src: ./share/man/man1/chunk.1
        dst: share/man/man1/chunk.1
      - src: ./share/bash-completion/completions/chunk
        dst: share/bash-completion/completions/chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: share/zsh/site-functions/_chunk
      - src: ./share/fish/vendor_completions.d/chunk.fish
        dst: share/fish/vendor_completions.d/chunk.fish

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

nfpms:
  - package_name: chunk
    license: MIT
    maintainer: web3technologies <noreply@github.com>
    homepage: https://github.com/web3technologies/chunk-cli
    description: Chunk CLI, inner loop validation for AI coding agents.
    recommends:
      - bash-completion
    contents:
      - src: ./share/man/man1/chunk.1
        dst: /usr/share/man/man1/chunk.1
        file_info:
          mode: 0644
      - src: ./share/bash-completion/completions/chunk
        dst: /usr/share/bash-completion/completions/chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: /usr/share/zsh/site-functions/_chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: /usr/share/zsh/vendor-completions/_chunk
        packager: deb
      - src: ./share/fish/vendor_completions.d/chunk.fish
        dst: /usr/share/fish/vendor_completions.d/chunk.fish
      - src: ./packaging/deb/copyright
        dst: /usr/share/doc/chunk/copyright
        packager: deb
        file_info:
          mode: 0644
    formats:
      - deb
      - rpm

notarize:
  macos:
    - enabled: '{{ isEnvSet "QUILL_SIGN_P12" }}'
      sign:
        certificate: '{{ envOrDefault "QUILL_SIGN_P12" ""}}'
      notarize:
        issuer_id: '{{ envOrDefault "QUILL_NOTARY_ISSUER" ""}}'
        key_id: '{{ envOrDefault "QUILL_NOTARY_KEY_ID" ""}}'
        key: '{{ envOrDefault "QUILL_NOTARY_KEY" ""}}'

# Metadata for the release
release:
  github:
    owner: web3technologies
    name: chunk-cli
  draft: false
  prerelease: auto
  # install.sh rides along with every release so the curl one-liner and a
  # pinned VERSION come from the same place.
  extra_files:
    - glob: ./install.sh
