# GoReleaser configuration for chunk
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go run . completion bash --output share/bash-completion/completions/chunk
    - go run . completion zsh --output share/zsh/site-functions/_chunk
    - go run . completion fish --output share/fish/vendor_completions.d/chunk.fish
    - go run . man --output share/man/man1/chunk.1

builds:
  - id: chunk
    binary: chunk
    main: .

    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath

    ldflags:
      - "-s -w -X main.version={{.Version}}"

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # Windows users expect .zip; other platforms keep the default tarball.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    builds_info:
      group: root
      owner: root
    files:
      - LICENSE
      - README.md
      - src: ./share/man/man1/chunk.1
        dst: share/man/man1/chunk.1
      - src: ./share/bash-completion/completions/chunk
        dst: share/bash-completion/completions/chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: share/zsh/site-functions/_chunk
      - src: ./share/fish/vendor_completions.d/chunk.fish
        dst: share/fish/vendor_completions.d/chunk.fish

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

nfpms:
  - package_name: chunk
    license: MIT
    maintainer: CircleCI
    homepage: https://github.com/CircleCI-Public/chunk-cli
    description: Chunk CLI by CircleCI.
    recommends:
      - bash-completion
    contents:
      - src: ./share/man/man1/chunk.1
        dst: /usr/share/man/man1/chunk.1
        file_info:
          mode: 0644
      - src: ./share/bash-completion/completions/chunk
        dst: /usr/share/bash-completion/completions/chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: /usr/share/zsh/site-functions/_chunk
      - src: ./share/zsh/site-functions/_chunk
        dst: /usr/share/zsh/vendor-completions/_chunk
        packager: deb
      - src: ./share/fish/vendor_completions.d/chunk.fish
        dst: /usr/share/fish/vendor_completions.d/chunk.fish
      - src: ./packaging/deb/copyright
        dst: /usr/share/doc/chunk/copyright
        packager: deb
        file_info:
          mode: 0644
    formats:
      - deb
      - rpm

notarize:
  macos:
    - enabled: '{{ isEnvSet "QUILL_SIGN_P12" }}'
      sign:
        certificate: '{{ envOrDefault "QUILL_SIGN_P12" ""}}'
      notarize:
        issuer_id: '{{ envOrDefault "QUILL_NOTARY_ISSUER" ""}}'
        key_id: '{{ envOrDefault "QUILL_NOTARY_KEY_ID" ""}}'
        key: '{{ envOrDefault "QUILL_NOTARY_KEY" ""}}'

chocolateys:
  - package_source_url: https://github.com/CircleCI-Public/chunk-cli
    owners: CircleCI
    title: Chunk CLI
    authors: CircleCI
    project_url: https://github.com/CircleCI-Public/chunk-cli
    copyright: 2026 CircleCI Inc
    license_url: https://raw.githubusercontent.com/CircleCI-Public/chunk-cli/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/CircleCI-Public/chunk-cli
    bug_tracker_url: https://github.com/CircleCI-Public/chunk-cli/issues
    tags: "ci"
    summary: Chunk CLI by CircleCI
    description: |
      `chunk` is CircleCI's inner loop validation tool. It runs quality checks
      (test, lint, format) on ephemeral Linux environments on CircleCI so
      environment-specific failures are caught before they reach CI.
    api_key: "{{ .Env.CHOCO_API_KEY }}"
    skip_publish: true

winget:
  - publisher: CircleCI
    name: Chunk CLI
    short_description: "CircleCI inner loop validation tool."
    installation_notes: |
      To enable PowerShell tab-completion, register the completions from your
      PowerShell profile ($PROFILE). The first command ensures the profile's
      parent directory exists (Add-Content creates the file but not the folder);
      the second appends the registration line:

        New-Item -ItemType Directory -Path (Split-Path $PROFILE) -Force | Out-Null
        Add-Content -Path $PROFILE -Value 'chunk completion powershell | Out-String | Invoke-Expression'
    description: |
      `chunk` is CircleCI's inner loop validation tool. It runs quality checks
      (test, lint, format) on ephemeral Linux environments on CircleCI so
      environment-specific failures are caught before they reach CI.
    license: "MIT"
    license_url: "https://github.com/CircleCI-Public/chunk-cli/blob/HEAD/LICENSE"
    tags:
      - chunk
      - circleci
      - cli
      - command-line-tool
      - continuous-integration
      - developer-tools
      - devops
      - golang
    publisher_url: "https://github.com/CircleCI-Public"
    publisher_support_url: "https://github.com/CircleCI-Public/chunk-cli/issues/new"
    package_identifier: CircleCI.Chunk
    url_template: "https://github.com/CircleCI-Public/chunk-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://circleci.com"
    copyright: "Circle Internet Services, Inc."
    skip_upload: true
    release_notes: "{{.Changelog}}"
    release_notes_url: "https://github.com/CircleCI-Public/chunk-cli/releases/tag/{{ .Tag }}"
    repository:
      owner: CircleCI-Public
      name: winget-pkgs
      branch: "chunk-cli-{{ .Tag }}"
      pull_request:
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# To refresh the snapcraft credentials, run:
# $ snapcraft export-login --snaps chunk --channels stable,candidate,edge,beta --acls package_push,package_release snapcraft-credentials.txt
# Then paste the contents into the SNAPCRAFT_STORE_CREDENTIALS context secret.
snapcrafts:
  - id: chunk
    name: chunk
    title: Chunk CLI
    summary: CircleCI inner loop validation tool
    description: |
      `chunk` is CircleCI's inner loop validation tool. It runs quality checks
      (test, lint, format) on ephemeral Linux environments on CircleCI so
      environment-specific failures are caught before they reach CI.
    license: MIT
    grade: devel
    confinement: strict
    publish: true
    # devel-grade snaps can only be released to edge/beta, never
    # candidate/stable. Pin the channels until grade becomes stable.
    channel_templates:
      - edge
      - beta
    apps:
      chunk:
        plugs:
          - home
          - network
        command: chunk

# Homebrew formula (stable)
brews:
  - name: chunk
    repository:
      owner: CircleCI-Public
      name: homebrew-circleci
    directory: Formula
    homepage: https://github.com/CircleCI-Public/chunk-cli
    description: "Chunk CLI by CircleCI"
    license: "MIT"
    test: |
      system "#{bin}/chunk"
    install: |
      bin.install "chunk"
      man1.install "share/man/man1/chunk.1"
      bash_completion.install "share/bash-completion/completions/chunk"
      zsh_completion.install "share/zsh/site-functions/_chunk"
      fish_completion.install "share/fish/vendor_completions.d/chunk.fish"

# Homebrew cask (preview builds)
homebrew_casks:
  - name: chunk@next
    directory: Casks
    repository:
      owner: CircleCI-Public
      name: homebrew-circleci
      branch: main
    homepage: "https://circleci.com"
    description: "Chunk CLI by CircleCI (preview build)."
    binaries:
      - chunk
    manpages:
      - share/man/man1/chunk.1
    completions:
      bash: share/bash-completion/completions/chunk
      zsh: share/zsh/site-functions/_chunk
      fish: share/fish/vendor_completions.d/chunk.fish
    caveats: |
      This preview build installs a `chunk` binary that conflicts with the
      stable `chunk` formula. If you have the formula installed, unlink it
      first to avoid a clashing symlink:

        brew unlink chunk

# Nix package (for NUR - Nix User Repository)
nix:
  - name: chunk
    repository:
      owner: CircleCI-Public
      name: nur-packages
    # Generate locally, push manually in CircleCI
    skip_upload: true
    homepage: https://github.com/CircleCI-Public/chunk-cli
    description: "Chunk CLI by CircleCI"
    license: "mit"
    path: pkgs/chunk/default.nix
    install: |
      mkdir -p $out/bin
      cp chunk $out/bin/

# Metadata for the release
release:
  github:
    owner: CircleCI-Public
    name: chunk-cli
  draft: false
  prerelease: auto
