name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v5
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -yqq shellcheck
      - name: Lint
        run: task lint
      - name: Test
        run: task test
      - name: Stress sidecar pool tests
        run: task test:stress
