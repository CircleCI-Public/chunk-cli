# Seeded defects in the factory-review-select reference solution. Each mutant is
# an exact find/replace on the solution-applied tree; `defect` is what a
# matching review finding has to identify. None is caught by the hidden checks.
task = "factory-review-select"

[[mutants]]
name = "daemon-skips-selection-without-prompts"
file = "internal/watchd/factory_run.go"
defect = "The daemon only applies review_names when the reviews directory has prompts, so a POST /factory naming reviews for a project with no review prompts is accepted and starts a validation-only run instead of being refused with a 400 (only the CLI's up-front check refuses it)."
find = """
	prompts, err = factory.SelectReviews(prompts, req.ReviewNames)
	if err != nil {
		return Session{}, apiErr(http.StatusBadRequest, "%v", err)
	}
"""
replace = """
	// With no prompts there is nothing to narrow.
	if len(prompts) > 0 {
		prompts, err = factory.SelectReviews(prompts, req.ReviewNames)
		if err != nil {
			return Session{}, apiErr(http.StatusBadRequest, "%v", err)
		}
	}
"""

[[mutants]]
name = "case-insensitive-check-exact-select"
file = "internal/factory/validate.go"
