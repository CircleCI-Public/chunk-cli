		known[strings.ToLower(p.Name)] = true
		available = append(available, p.Name)
	}
	wanted := make(map[string]bool, len(names))
	var unknown []string
	for _, n := range names {
		if wanted[n] {
			continue
		}
		wanted[n] = true
		if !known[strings.ToLower(n)] {
"""

[[mutants]]
name = "json-skips-up-front-check"
file = "internal/cmd/factory.go"
defect = "With --json the CLI skips its up-front check of --review names and leaves the refusal to the daemon, so `chunk factory --json --review nope` exits 1 (the daemon's 400 shown as a generic error) instead of the bad-arguments exit code 2 with the list of available reviews."
find = """
			if err := checkReviewNames(prompts, reviewNames); err != nil {
				return err
			}
"""
replace = """
			// With --json the daemon's refusal is reported as it gives it.
			if !jsonOut {
				if err := checkReviewNames(prompts, reviewNames); err != nil {
					return err
				}
			}
"""
