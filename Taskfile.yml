version: '3'

vars:
  RESULTS_DIR: test-reports
  TEST_REPORT: test-reports/tests.xml
  LINT_REPORT: test-reports/lint.xml

tasks:
  build:
    desc: Build the smelt binary, then restart the daemon if no factory run is active
    cmds:
      - go build -o dist/smelt .
      - ./scripts/restart-daemon.sh

  daemon:restart:
    desc: Stop the smelt daemon so it restarts from the current build (cancels active runs)
    cmds:
      - ./scripts/restart-daemon.sh --force

  test:
    desc: Run the tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool gotestsum -- -race {{.ARGS}}

  lint:
    desc: Run `golangci-lint run` to lint the code
    summary: Lint the project with golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool golangci-lint run {{.ARGS}}
      - task: check:circleci
      - task: check:names
      - task: lint:shell
      - uv run --project harness pylint --rcfile harness/pyproject.toml harness/environment.py
      - uv run --project harness pylint --rcfile harness/pyproject.toml harness/factory.py

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "." .CLI_ARGS}}'
    cmds:
      - go tool gosimports -local "$(go list -m)" -w {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy' to clean up module files.
    cmds:
      - go mod tidy -v

  dev-install:
    desc: Symlink dist/smelt into ~/.local/bin so hooks pick up the local build automatically after each `task build`
    cmds:
      - task: build
      - mkdir -p ${HOME}/.local/bin
      - ln -sf "$(pwd)/dist/smelt" ${HOME}/.local/bin/smelt

  dev-uninstall:
    desc: Remove the dev symlink from ~/.local/bin (restores the system smelt)
    cmds:
      - rm -f ${HOME}/.local/bin/smelt

  acceptance-test:
    desc: Run acceptance tests
    vars:
      ARGS: '{{default "./acceptance/..." .CLI_ARGS}}'
    cmds:
      - go tool gotestsum -- -race {{.ARGS}}

  env-harness:
    desc: |
      Run smelt sidecar env/build against target repos, using Claude to improve
      envbuilder on failure. Args are passed through to harness/environment.py.
      Examples:
        task env-harness                                       # all known repos
        task env-harness -- --repo flask                      # single nickname
        task env-harness -- --repo https://github.com/x/y    # any Git URL
        task env-harness -- --repo flask --timeout 1200
    cmds:
      - uv run --project harness harness/environment.py {{.CLI_ARGS}}

  factory-harness:
    desc: |
      Run an adaptive factory experiment against this repository's pinned baseline.
      Args are passed through to harness/factory.py.
      Examples:
        task factory-harness
        task factory-harness -- --passes 3
        task factory-harness -- --passes 1 --profile targeted --no-advisor
    cmds:
      - uv run --project harness harness/factory.py {{.CLI_ARGS}}

  release:
    desc: Tag vX.Y.Z and push it; GitHub Actions builds and publishes the release
    summary: |
      task release VERSION=1.0.0   # tags v1.0.0 and pushes it
      task release                 # tags the next patch after the latest v1+ tag
    vars:
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - task: tag
        vars: { VERSION: '{{.VERSION}}' }
      - |
        TAG=$(cat /tmp/smelt-release-tag)
        git push origin "${TAG}"
        echo "Pushed ${TAG}; the Release workflow will publish it."

  generate:
    desc: Run generation of any generated code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go generate -x {{.ARGS}}

  mod-download:
    desc: Run 'go mod download' to retrieve module files.
    cmds:
      - go mod download -x

  lint:shell:
    desc: Run shellcheck on install.sh (skipped with a notice when shellcheck is not installed)
    cmds:
      - |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck install.sh
        else
          echo "shellcheck not installed; skipping install.sh lint" >&2
        fi

  check:circleci:
    desc: Fail on references to CircleCI-owned repositories, packages and endpoints outside the CircleCI backend
    cmds:
      - scripts/check-circleci.sh

  check:names:
    desc: Fail on the old project name outside the license attribution and CircleCI API-contract strings
    cmds:
      - scripts/check-names.sh

  # Tasks below here are intended mainly to be run as part of CI

  ci:lint:
    desc: Run `golangci-lint run` to lint the code, outputting a report.
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run the tests and output the test results
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - go tool gotestsum --junitfile="{{.TEST_REPORT}}" -- -race -count=1 {{.ARGS}}

  ci:diff:
    desc: Check no diffs
    cmds:
      - task: generate
      - task: fmt
      - task: mod-tidy
      - git diff --exit-code

  tag:
    desc: Create the next git tag (vX.Y.Z) locally, optionally specifying a version as X.Y.Z. The fork's line starts at v1.0.0; upstream's v0.x tags are ignored.
    vars:
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - |
        git fetch --force --tags

        if [ -n "{{.VERSION}}" ]; then
          TAG="v{{.VERSION}}"
          case "${TAG}" in
            v[1-9]*.*.*) ;;
            *) echo "Error: ${TAG} is below v1.0.0; this fork's releases start at v1.0.0" >&2; exit 1 ;;
          esac
          if git tag | grep -q "^${TAG}$"; then
            echo "Error: tag ${TAG} already exists" >&2
            exit 1
          fi
        else
          # Only v1+ tags count: the v0.x tags are upstream's line, not ours.
          LATEST=$(git tag --list 'v[1-9]*.[0-9]*.[0-9]*' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)
          if [ -z "$LATEST" ]; then
            echo "Error: no v1.0.0+ tags yet; start the line with: task release VERSION=1.0.0" >&2
            exit 1
          fi
          PATCH=$(echo "$LATEST" | awk -F. '{print $3}')
          TAG="${LATEST%.*}.$((PATCH + 1))"
        fi

        echo "Tagging version: ${TAG}"
        git tag "${TAG}"
        echo "${TAG}" > /tmp/smelt-release-tag
